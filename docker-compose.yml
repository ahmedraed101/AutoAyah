services:
  autoayah:
    build: .
    ports:
      - "3737:3737"
    env_file:
      - .env
    environment:
      APP_MODE: ${APP_MODE:-self_hosted}
      PORT: 3737
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3737}
      DATA_DIR: /app/data
    volumes:
      - ./data:/app/data
    restart: unless-stopped

